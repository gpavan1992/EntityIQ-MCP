[project]
name = "entityiq-mcp"
version = "1.0.0"
description = "Public business intelligence MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.6.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
